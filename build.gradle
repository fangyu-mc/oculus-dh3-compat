['default', 'no-ea'].each { mode ->
	def checkTask = tasks.register('RenderAllocationCheck_' + mode, JavaExec) {
		dependsOn renderAllocationCheckCompile
		classpath = files(layout.buildDirectory.dir('render-allocation-check'), layout.buildDirectory.dir('frame-time-instrumentation-check')) + sourceSets.main.output + sourceSets.main.compileClasspath
		mainClass = 'net.coderbot.iris.diagnostics.RenderAllocationCheck'
		args mode
		doFirst {
			def srgMinecraft = fileTree(new File(gradle.gradleUserHomeDir, "caches/fabric-loom/${minecraft_version}")) {
				include "*-forge-${minecraft_version}-${forge_version}/minecraft-srg.jar"
			}.files
			if (srgMinecraft.empty) throw new GradleException('Production SRG Minecraft jar missing for render allocation check')
			args srgMinecraft.collect { it.absolutePath }
		}
		jvmArgs '-Xverify:all'
		if (mode == 'no-ea') jvmArgs '-XX:-DoEscapeAnalysis'
	}
	check.dependsOn checkTask
}
