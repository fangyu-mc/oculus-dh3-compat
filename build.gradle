		def extensionJars = fileTree('../test/.minecraft/versions/虚无/mods') { include '*embeddiumextension-*.jar' }.files
		onlyIf { !extensionJars.empty }
		args([mode] + extensionJars.collect { it.absolutePath })
		// A standalone Mixin/bytecode test host, not a game. EA is disabled only for allocation assertions.
		jvmArgs '-Xverify:all', '-XX:-DoEscapeAnalysis'
	}
	check.dependsOn checkTask
}

