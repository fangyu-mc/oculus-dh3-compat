	options.compilerArgs += ['-proc:none']
	doLast {
		def services = new File(destinationDirectory.get().asFile, 'META-INF/services')
		services.mkdirs()
		['IMixinService', 'IGlobalPropertyService'].each { service ->
			new File(services, 'org.spongepowered.asm.service.' + service).text =
				'net.coderbot.iris.diagnostics.FrameTimeInstrumentationCheck$Service\n'
		}
		new File(destinationDirectory.get().asFile, 'biome-zoom-check.json').text =
			'{"required":true,"minVersion":"0.8","compatibilityLevel":"JAVA_8","package":"net.coderbot.iris.mixin.math","client":["MixinFuzzyOffsetBiomeZoomer"]}'
	}
}
tasks.register('FrameTimeInstrumentationCheck', JavaExec) {
	dependsOn frameTimeInstrumentationCheckCompile
	classpath = files(layout.buildDirectory.dir('frame-time-instrumentation-check')) + sourceSets.main.output + sourceSets.main.compileClasspath
	mainClass = 'net.coderbot.iris.diagnostics.FrameTimeInstrumentationCheck'
	args fileTree('../test/.minecraft/versions/虚无/mods') {
		include '*embeddium-*.jar', '*DistantHorizons*.jar', 'xaeroworldmap-*.jar', '*DynamicSurroundings-*.jar'
	}.files.collect { it.absolutePath }
	// Resolve the Loom production namespace from its configured cache, without launching a client.
	doFirst {
		def srgMinecraft = fileTree(new File(gradle.gradleUserHomeDir, "caches/fabric-loom/${minecraft_version}")) {
			include "*-forge-${minecraft_version}-${forge_version}/minecraft-srg.jar"
		}.files
		if (srgMinecraft.isEmpty()) { throw new GradleException('Production SRG Minecraft jar missing for tick instrumentation check') }
		args srgMinecraft.collect { it.absolutePath }
	}
	jvmArgs '-Xverify:all'
}
check.dependsOn tasks.named('FrameTimeInstrumentationCheck')

